name: go-rate-limiter

services:
  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 20

  node-a:
    image: ${RATE_LIMITER_IMAGE:-go-rate-limiter}
    build:
      context: .
      target: demo
    command: ["serve"]
    environment:
      NODE_ID: node-a
      REDIS_ADDR: redis:6379
      RATE_PER_SECOND: "${RATE_PER_SECOND:-1000}"
      BURST: "${BURST:-1000}"
    ports:
      - "${NODE_A_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 1s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy

  node-b:
    image: ${RATE_LIMITER_IMAGE:-go-rate-limiter}
    build:
      context: .
      target: demo
    command: ["serve"]
    environment:
      NODE_ID: node-b
      REDIS_ADDR: redis:6379
      RATE_PER_SECOND: "${RATE_PER_SECOND:-1000}"
      BURST: "${BURST:-1000}"
    ports:
      - "${NODE_B_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 1s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy

  k6:
    image: grafana/k6:2.1.0@sha256:65c920dc067d5e2e00befbf982af6ad6ad0117034e8b1c65817c7975c52d4669
    profiles: ["load"]
    command: ["run", "/scripts/k6.js"]
    environment:
      TARGETS: http://node-a:8080,http://node-b:8080
    volumes:
      - ./benchmarks/k6.js:/scripts/k6.js:ro
    depends_on:
      - node-a
      - node-b
