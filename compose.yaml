name: go-rate-limiter

services:
  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 20

  node-a:
    build:
      context: .
      target: app
    command: ["serve"]
    environment:
      NODE_ID: node-a
      REDIS_ADDR: redis:6379
      RATE_PER_SECOND: "1000"
      BURST: "1000"
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  node-b:
    build:
      context: .
      target: app
    command: ["serve"]
    environment:
      NODE_ID: node-b
      REDIS_ADDR: redis:6379
      RATE_PER_SECOND: "1000"
      BURST: "1000"
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy

  k6:
    image: grafana/k6:2.1.0
    profiles: ["load"]
    command: ["run", "/scripts/k6.js"]
    environment:
      TARGETS: http://node-a:8080,http://node-b:8080
    volumes:
      - ./benchmarks/k6.js:/scripts/k6.js:ro
    depends_on:
      - node-a
      - node-b
